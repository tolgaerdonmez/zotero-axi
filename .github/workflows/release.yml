name: Release

# Stages an npm publish when you publish a GitHub Release (tag like v0.1.0).
# The NPM_TOKEN lives in the `staging` GitHub Environment and has npm
# "Read and write (stage only)" permission, so this workflow STAGES the version;
# a maintainer promotes it to live on npmjs.com (or with `npm publish` locally).
on:
  release:
    types: [published]

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/*.test.js

      # Guard: the release tag (v1.2.3) must match package.json version (1.2.3).
      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Stage publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: echo "Staged ${GITHUB_REF_NAME}. Promote it to live on npmjs.com to finish the release." >> "$GITHUB_STEP_SUMMARY"
